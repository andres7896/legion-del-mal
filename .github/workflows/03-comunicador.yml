name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'Nombre del villano que envia el mensaje'
        required: true
        type: choice
        options:
          - 'Dr. Maligno'
          - 'El Profesor'
          - 'El Cientifico Loco'
          - 'El Maestro del Caos'
        default: 'Dr. Maligno'
      mesaje:
        description: 'Contenido del mensaje'
        required: true
        type: string
        default: 'Mensaje secreto de la Legion'
      prioridad:
        description: 'Prioridad del mensaje'
        required: true
        type: choice
        options:
          - 'Alta'
          - 'Media'
          - 'Baja'
        default: 'Media'

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs recibidos:"
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mesaje }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
