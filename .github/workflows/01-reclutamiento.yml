name: Reclutamiento de agente

on: 
  workflow_dispatch:

jobs:
  reporte-de-recutamiento:
    runs-on: ubuntu-latest
    steps:
      - name: El agente se presenta
        run: echo "Hola, soy el agente de reclutamiento y estoy listo para ayudar."

      - name: Reporte de identidad
        run: | 
          echo "Nombre del agente: Agente de Reclutamiento"
          echo "==============="
          echo "Versión: 1.0"
          echo "Función: Ayudar en el proceso de reclutamiento de candidatos."
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de GitHub"
          echo "Repo: ${{ github.repository }}"
          echo "SHA: ${{ github.sha }}"
          echo "Metadata: ${{ toJson(github) }}"

      - name: Capacidades del agente
        run: |
          echo "Capacidades detectadas:"
          echo "Sistema operativo"
          uname -a
          echo "Habilidades tecnicas"
          node --version
          git --version
          python3 --version

      - name: Reconocimiento de entorno
        run: |
          echo "Entorno de ejecución:"
          echo "Sistema operativo: $(uname -s)"
          echo "Versión del kernel: $(uname -r)"
          echo "Arquitectura: $(uname -m)"
          echo "Directorio actual: $(pwd)"
          echo "Variables de entorno:"
          printenv
      
      - name: Secretos
        run: |
          echo "Secretos guardados en GitHub:"
          echo "API_KEY: ${{ secrets.API_KEY }}"
          echo "GIT_TOKEN: ${{ secrets.GIT_TOKEN }}"