name: Control de Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Se accede a los planes
        uses: actions/checkout@v4

      - name: El consejo accede a los planes
        run: |
          chmod +x scripts/validar-planes.sh
          ./scripts/validar-planes.sh