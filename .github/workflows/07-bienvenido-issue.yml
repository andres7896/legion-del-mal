name: 🤖 Bienvenido a la Legion

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  respuesta-de-brainiac:
    runs-on: ubuntu-latest

    steps:
      - name: Brainiac responde al issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const mensaje = `Gracias por tu reporte, ${{ github.event.issue.user.login }}. 🦾

            Tu issue **#${context.issue.number}** ya está en nuestras manos. Brainiac lo está revisando en este preciso momento.

            El Consejo de la Legión se pondrá en contacto contigo en cuanto haya una actualización.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: mensaje
            });

      - name: Enviar correo de notificacion
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Nuevo issue creado: #${{ github.event.issue.number }}"
          to: sneider7896@gmail.com
          from: Legion del Mal
          body: |
            Hola, se ha creado un nuevo issue en el repositorio ${{ github.repository }}.

            Titulo: ${{ github.event.issue.title }}
            Autor: ${{ github.event.issue.user.login }}
            URL: ${{ github.event.issue.html_url }}

            Brainiac ya esta revisando el issue.
